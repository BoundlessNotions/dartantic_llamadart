name: dartantic_llamadart
description: Local GGUF and LiteRT-LM model support for Dartantic AI using llamadart.
version: 0.6.9
repository: https://github.com/BoundlessNotions/dartantic_llamadart

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  dartantic_interface: ^4.0.0
  llamadart: '>=0.8.4 <0.9.0'
  meta: ^1.11.0

dev_dependencies:
  # For the example only.
  dartantic_ai: ^3.4.2
  # Not imported. Raises the floor of a test runner dependency: 3.x looks for
  # the JIT frontend_server snapshot, which current Dart SDKs no longer ship,
  # so `dart test` fails after `dart pub downgrade` without it.
  frontend_server_client: ^4.0.0
  lints: ^6.1.0
  test: ^1.32.0
