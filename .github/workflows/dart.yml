name: Dart

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `downgrade` resolves every dependency to its lowest allowed version,
        # which keeps the pubspec lower bounds honest.
        deps: [ upgrade, downgrade ]
    name: build (${{ matrix.deps }})

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub ${{ matrix.deps }}

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze

      - name: Run tests
        run: dart test
